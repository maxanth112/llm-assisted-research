[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etd-ach-experiment"
version = "0.1.0"
description = "EXP-1: Evidence-to-Decision via Analysis of Competing Hypotheses — factorial experiment infrastructure"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Max Anthony"}]

dependencies = [
    "pydantic>=2.0,<3",
    "jinja2>=3.1,<4",
    "numpy>=1.24,<2",
    "scipy>=1.11,<2",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "detect-secrets>=1.4,<2",
]

[tool.setuptools.packages.find]
include = ["harness*", "datasets*", "analysis*", "protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
